org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ---- Kotlin 增量编译：**必须关着** ----
#
# 曾经把它打开过（理由很正当：关掉等于每次全量重编译 Kotlin，慢）。
# 但实测**这套工具链下打不出来包**：
#
#   Execution failed for task ':shared_preferences_android:compileReleaseKotlin'
#   > Could not close incremental caches in .../caches-jvm/jvm/kotlin:
#     class-fq-name-to-source.tab, source-to-classes.tab, internal-name-to-source.tab
#
# 清掉 `build/*/kotlin` 只能让它换个模块再挂一次（第一次是
# file_selector_android / image_picker_android，清完变成
# shared_preferences_android）—— 说明不是残留脏数据，是 Kotlin 2.4.0
# 的增量缓存和 AGP 9.1 的新构建 API 在这个环境下不兼容。
#
# 所以保持 false。构建慢一点，但**能出包**比慢重要得多。
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false

# ---- 刻意**不开** `org.gradle.parallel` / `org.gradle.caching` ----
#
# 这两个开关看着是白送的速度，但对这个工程是有毒的：
#  · Chaquopy 在**构建期**跑 pip 装 wheel，它的任务彼此有隐含依赖，
#    并行执行会产出不完整的 Python 包 —— 用户看到的是运行时的
#    ImportError，而不是构建失败，极难排查；
#  · `org.gradle.caching` 会把 Chaquopy/Flutter 的产物缓存起来复用，
#    而 Python 包的产物依赖网络当时的 wheel 版本，缓存命中后行为会
#    和清缓存时不一致。
#
# 结论：这两个开关的收益远小于"构建偶发产出坏包"的代价，保持默认关闭。

# 网络源不通时快速失败，不要死等
systemProp.org.gradle.internal.http.connectionTimeout=10000
systemProp.org.gradle.internal.http.socketTimeout=30000

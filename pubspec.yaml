name: dsh_agent
description: "Zeus — 手机上的 AI agent：Shizuku 系统能力 + 内嵌 Python + 笔记任务"
publish_to: 'none'

# versionCode（+131）必须单调递增：Android 用它判断"哪个更新"，
# 不能跟着 versionName 一起重置。
version: 3.0.0+1081

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # 密码哈希（SHA-256 + 迭代）。已在依赖图里（transitive），
  # 提成直接依赖才能 import。
  crypto: ^3.0.3

  cupertino_icons: ^1.0.9

  # 网络：调用模型 / 搜索 API / 视觉 API
  http: ^1.6.0
  # 设置持久化（API key、模型、开关）
  shared_preferences: ^2.5.5
  # 应用私有目录：截图、录屏、插件、主题包
  path_provider: ^2.1.6
  # 选图 / 选任意文件发给模型
  image_picker: ^1.2.4
  file_selector: ^1.1.0
  # 图片处理（缩放、压缩、缩略图、生图落盘）
  image: ^4.12.0
  # 内置浏览器：真实 WebView 环境，搜索抓取和登录态都靠它
  flutter_inappwebview: ^6.1.5
  # 打开 AI 回复里的链接
  url_launcher: ^6.3.2
  # LaTeX 公式：纯 Dart、无原生代码，不引入 AGP/NDK 兼容问题
  flutter_math_fork: ^0.7.4
  # 离线 OCR（识图的本地方案，不需要额外 key）
  google_mlkit_text_recognition: ^0.13.1
  # 知识库文档解析：docx/xlsx 本质是 zip + XML（纯 Dart，无原生依赖）
  archive: ^4.0.7
  xml: ^6.5.0
  # Office 预览里的 SVG 图片（PowerPoint / Word 常把图标存成 SVG）
  flutter_svg: ^2.3.0
  # iOS 26 风格的液态玻璃控件（导航栏 / 标签栏 / 面板）
  liquid_glass_widgets: ^1.13.0
  # 系统动态取色（Material You）
  dynamic_color: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

dependency_overrides:
  # 上游 flutter_inappwebview_android 1.1.3 的 android/build.gradle 用了
  # AGP 9 已移除的 getDefaultProguardFile('proguard-android.txt')，会直接导致
  # 构建失败。1.1.3 已是最新稳定版，没有兼容 AGP 9 的版本可用，而本项目的
  # 构建链沿用已钉住的 AGP 9.1.0，所以把插件 vendor 到 third_party/ 并打补丁。
  # 详见 third_party/flutter_inappwebview_android/VENDORED.md
  flutter_inappwebview_android:
    path: third_party/flutter_inappwebview_android

  # jni 1.1.x 要求更新的 AGP / NDK；钉在 1.0.3，和已验证的构建链一致。
  jni_flutter: 1.0.3

flutter:
  uses-material-design: true

  assets:
    # 字体目录也当普通资源声明一次：`fonts:` 只负责**注册**字体族，
    # 而预览出图（test/preview_fonts.dart）要用 rootBundle 直接读
    # `assets/fonts/CJK-subset.ttf` / `Mono.ttf` —— 那两份只在 assets 里
    # 声明过才读得到。少了它，测试里所有中文会渲染成空心方块。
    - assets/fonts/
    - assets/icon/
    - assets/plugins/
    - assets/termux/
    - assets/tools/
    - assets/pptx_viewer/
    # Agent.md 的推荐模板：设置 → Agent.md → 「填入推荐模板」读它。
    - assets/agent_md_template.md

  # ---- 界面字体：Inter ----
  #
  # 从 `Inter.ttc`（Inter 4.1）里抽出四个**静态字面**打进 APK：
  # 400 / 500 / 600 / 700，约 1.6 MB。
  #
  # ## 为什么抽静态字面，而不是直接打包 ttc
  #
  #  · `Inter.ttc` 是 13 MB 的**字体集合**（36 个字面，还混着
  #    Display / Italic 两套变体）—— 全打进去 APK 直接胖一圈，
  #    而界面只用得到四档字重；
  #  · Flutter **不支持 ttc**：`fonts:` 只认单个 sfnt 文件。
  #
  # 用 `tools/extract_ttc.py` 抽出来的（一次一个字面）：
  #   python tools/extract_ttc.py Inter.ttc --list          # 看索引
  #   python tools/extract_ttc.py Inter.ttc assets/fonts/Inter-Regular.ttf 0
  #   python tools/extract_ttc.py Inter.ttc assets/fonts/Inter-Medium.ttf 10
  #   python tools/extract_ttc.py Inter.ttc assets/fonts/Inter-SemiBold.ttf 12
  #   python tools/extract_ttc.py Inter.ttc assets/fonts/Inter-Bold.ttf 14
  # 换字体时改 `AppFonts.uiFamily` 即可，不需要动这里。
  #
  # ## 汉字不在这份字体里
  #
  # Inter 只有拉丁、数字、标点（2937 个字形，没有 CJK）。中文靠
  # `AppFonts.bodyFallback` 里的 `sans-serif` 由系统接住（Android 上是
  # Noto Sans CJK）。**不要删那条兜底链**，删了中文会变成空心方块。
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

  # `assets/fonts/` 目录本身**仍然在 assets 里声明**（见上面）：出图测试
  # （`test/preview_fonts.dart`）要用 `rootBundle` 读那份字体当"系统字体
  # 的替身"——测试环境没有任何真实字体，不注册的话全是黑方块。
